{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="page-heading form-heading">
  <div>
    <div class="eyebrow">KEEP YOUR RECORDS UP TO DATE</div>
    <h1>{{ heading }}</h1>
    <p>A few details are all it takes to keep your spending clear.</p>
  </div>
  <a class="button button-outline" href="{{ url_for('tracker.expenses') }}">← Back to transactions</a>
</section>

<section class="panel form-panel">
  <form method="post" class="expense-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-section-label"><span>01</span> Expense details</div>
    <div class="form-grid">
      <label class="form-field form-field-wide">
        <span>What was it for? <b>*</b></span>
        <input type="text" name="title" value="{{ expense.title }}" maxlength="100" placeholder="e.g. Weekly groceries" required autofocus>
      </label>
      <label class="form-field">
        <span>Amount <b>*</b></span>
        <div class="amount-input"><span>{{ currency_symbol }}</span><input type="number" name="amount" value="{{ expense.amount }}" min="0.01" max="999999999.99" step="0.01" placeholder="0.00" required></div>
      </label>
      <label class="form-field">
        <span>Category <b>*</b></span>
        <select name="category" required>{% for category in categories %}<option value="{{ category }}" {% if expense.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select>
      </label>
      <label class="form-field">
        <span>Date <b>*</b></span>
        <input type="date" name="spent_on" value="{{ expense.spent_on }}" required>
      </label>
      <label class="form-field form-field-wide">
        <span>Notes <small>OPTIONAL</small></span>
        <textarea name="notes" rows="4" maxlength="500" placeholder="Add a note to remember the details...">{{ expense.notes }}</textarea>
      </label>
    </div>
    <div class="form-footer">
      <p><b>*</b> Required fields</p>
      <div><a class="button button-outline" href="{{ url_for('tracker.expenses') }}">Cancel</a><button class="button button-primary" type="submit">{{ submit_label }} <span>→</span></button></div>
    </div>
  </form>
</section>
{% endblock %}
